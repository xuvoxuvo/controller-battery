[workspace]
resolver = "2"
members = [
    "crates/controller-battery-core",
    "crates/controller-battery-widget",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["xuvoxuvo <xuvo@qq.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
