name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) { $version = "dev" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/controller-battery.exe dist/controller-battery.exe
          Compress-Archive -Path dist/controller-battery.exe -DestinationPath "dist/controller-battery-$version-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-battery-windows-x64
          path: |
            dist/controller-battery.exe
            dist/controller-battery-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/controller-battery.exe
            dist/controller-battery-*-windows-x64.zip
          generate_release_notes: true
